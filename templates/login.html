<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login DASMEX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            color: #222;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .auth-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            max-width: 430px;
            padding: 28px;
            width: 100%;
        }

        .header {
            align-items: center;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        h1 {
            color: #0aa6b5;
            font-size: 28px;
            margin: 0;
        }

        .logo {
            height: 58px;
            object-fit: contain;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 14px 0 6px;
        }

        input {
            border: 1px solid #c8d0d7;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            padding: 11px 12px;
            width: 100%;
        }

        .btn {
            background: #0aa6b5;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            padding: 14px 22px;
            width: 100%;
        }

        .btn:hover {
            background: #088d99;
        }

        .message {
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px 12px;
        }

        .message.success {
            background: #e7f8ec;
            border: 1px solid #bde8c8;
            color: #1e7a38;
        }

        .message.error {
            background: #fff0f0;
            border: 1px solid #f1c1c1;
            color: #a22929;
        }

    </style>
</head>
<body>
<main class="auth-card">
    <div class="header">
        <h1>Acceso</h1>
        <img src="{{ url_for('static', filename='Logo.png') }}" alt="Logo DASMEX" class="logo">
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required autofocus>

        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn">Entrar al cotizador</button>
    </form>

</main>
</body>
</html>
